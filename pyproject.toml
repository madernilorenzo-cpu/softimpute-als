[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softimpute-als"
version = "0.1.0"
description = "Python implementation of 'Matrix Completion and Low-Rank SVD via Fast Alternating Least Squares' (Hastie, Mazumder, Lee & Zadeh, JMLR 2015)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Maderni" }]
keywords = ["matrix completion", "recommender systems", "nuclear norm", "alternating least squares", "low-rank"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
